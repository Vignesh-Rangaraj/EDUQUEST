<text x="95" y="1150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324D" text-anchor="start">Relationship and scope notes</text>
<text x="95" y="1190" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#24364B" text-anchor="start">School → Classroom → Teacher / Student / Module → Activity → lesson, game, quiz and progress records.</text>
<text x="95" y="1225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#24364B" text-anchor="start">Student → progress, XP ledger, badges and sync queue; Parent → Student. Lines follow the manuscript's stated relationships.</text>
<text x="95" y="1260" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#5D7188" text-anchor="start">UserAccount identifiers are shown as scalar references and omitted as an additional entity to preserve the 14-entity scope.</text>
<text x="95" y="1300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#B64242" text-anchor="start">Some associations (e.g., module_id, activity_id) are represented by scalar IDs in the current backend model; connector lines indicate logical links.</text>
